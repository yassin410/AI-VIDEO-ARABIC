 <section id="communityView" class="app-view"><div class="section-head"><div><div class="section-title">مجتمع الأعضاء</div><div class="section-sub">اسأل، شارك تطبيقك، وخذ رأي المجتمع</div></div></div><div class="community-card"><div class="community-head"><span class="online-dot"></span><div><div class="community-title">دردشة AIVideoSyria</div><div class="community-sub">متاحة للأعضاء المسجلين فقط</div></div></div><div id="messages" class="messages"><div class="chat-empty">⏳ جاري تحميل الرسائل...</div></div><form id="chatForm" class="chat-form" onsubmit="sendMessage(event)"><input id="chatInput" class="chat-input" maxlength="500" autocomplete="off" placeholder="اكتب رسالتك هنا..."><button id="sendBtn" class="send-btn" type="submit" aria-label="إرسال">➤</button></form></div></section>
</main>
<nav class="app-bottom-nav" aria-label="تنقل التطبيق"><button id="navLessons" class="active" type="button" onclick="showView('lessons')"><span class="nav-icon">📚</span>الدروس</button><button id="navAccount" type="button" onclick="showView('account')"><span class="nav-icon">👤</span>حسابي</button><button id="navCommunity" type="button" onclick="showView('community')"><span class="nav-icon">💬</span>المجتمع</button></nav>
<div class="modal" id="stageModal"><div class="modal-box"><div class="modal-header"><span class="modal-title">دروس المرحلة</span><button class="close-btn" onclick="closeStage()">✕</button></div><div id="stageContent" style="padding:15px 17px 18px"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://xcbhyjgvwhnaygnpnegt.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjYmh5amd2d2huYXlnbnBuZWd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDkxODAsImV4cCI6MjEwMzk4NTE4MH0.fPh9QGniWAyg_Jg5uO0zpDoA03nvNbHHNXH9qocbmpM';

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const STAGES=[{num:1,title:'مقدمة وأساسيات الذكاء الاصطناعي',desc:'فهم الأدوات والمصطلحات الأساسية',icon:'🚀'},{num:2,title:'توليد الصور بالذكاء الاصطناعي',desc:'إنشاء صور احترافية من النص',icon:'🎨'},{num:3,title:'توليد الفيديوهات',desc:'تحويل الصور والأفكار لفيديوهات مذهلة',icon:'🎬'},{num:4,title:'الصوت والمونتاج',desc:'إضافة الصوت والمؤثرات وتحرير الفيديو',icon:'🎧'},{num:5,title:'ثبات الشخصية',desc:'شخصية AI متسقة في كل الفيديوهات',icon:'🧑'},{num:6,title:'صناعة الإعلانات',desc:'إعلانات تجارية احترافية بدون تصوير',icon:'📣'},{num:7,title:'محتوى السوشيال ميديا',desc:'ريلز وتيك توك وفيسبوك بالذكاء الاصطناعي',icon:'📱'},{num:8,title:'صناعة الأفلام القصيرة',desc:'قصص وأفلام كاملة من الهاتف',icon:'🎞️'},{num:9,title:'الأتمتة وتوليد المحتوى التلقائي',desc:'نظام ينتج المحتوى لوحده',icon:'⚙️'}];
let currentUser=null,allLessons=[],currentStage=null,currentLesson=null,progress={},daysSinceStart=0,chatLoaded=false,chatChannel=null;
function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function withTimeout(promise,ms=10000){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),ms))])}
function progressKey(){return `ai_academy_progress_${currentUser.id}`}
function loadProgress(){try{progress=JSON.parse(localStorage.getItem(progressKey())||'{}')||{}}catch(e){progress={}}}
function saveProgress(){localStorage.setItem(progressKey(),JSON.stringify(progress))}
function lessonId(lesson){return String(lesson.id)}
function isCompleted(lesson){return !!progress[lessonId(lesson)]}
function getStageLessons(stageNum){return allLessons.filter(l=>Number(l.display_order)===Number(stageNum)).sort((a,b)=>{const ad=a.created_at?new Date(a.created_at).getTime():0,bd=b.created_at?new Date(b.created_at).getTime():0;return ad!==bd?ad-bd:String(a.id).localeCompare(String(b.id))})}
function stageUnlockDays(stageLessons,stageNum){const values=stageLessons.map(l=>Number(l.unlock_after_days)||0);return values.length?Math.min(...values):(stageNum-1)*7}

function showView(view){const map={lessons:'lessonsView',account:'accountView',community:'communityView'};Object.values(map).forEach(id=>document.getElementById(id).classList.remove('active'));['Lessons','Account','Community'].forEach(n=>document.getElementById('nav'+n).classList.remove('active'));document.getElementById(map[view]).classList.add('active');document.getElementById('nav'+view.charAt(0).toUpperCase()+view.slice(1)).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});if(view==='community'&&!chatLoaded)loadCommunity()}

async function init(){try{const {data:{user}}=await withTimeout(sb.auth.getUser(),12000);if(!user){location.href='login.html';return}currentUser=user;loadProgress();const [profileResult,membershipResult]=await Promise.all([withTimeout(sb.from('users').select('full_name,whatsapp_number,role').eq('id',user.id).single(),12000),withTimeout(sb.from('memberships').select('*').eq('user_id',user.id).order('created_at',{ascending:false}).limit(1).single(),12000)]);const userData=profileResult.data||{};if(userData.role==='admin'){location.href='admin.html';return}const name=userData.full_name||user.user_metadata?.full_name||'عضو';window.__academyName=name;document.getElementById('profileName').value=name==='عضو'?'':name;document.getElementById('profilePhone').value=userData.whatsapp_number||user.user_metadata?.whatsapp_number||'';document.getElementById('accountDisplayName').textContent=name;document.getElementById('accountEmail').textContent=user.email||'';const membership=membershipResult.data,content=document.getElementById('content');if(!membership||membership.status==='pending'){content.innerHTML=`<div class="status-card status-pending"><div class="status-icon">⏳</div><div class="status-title">حسابك قيد المراجعة</div><div class="status-msg">مرحباً ${escapeHTML(name)}!<br>سيتم تفعيل حسابك بعد تأكيد الدفع.</div><a href="https://wa.me/${WHATSAPP}" class="wa-btn">📱 تواصل معنا</a></div>`;return}if(membership.status==='expired'||(membership.end_date&&new Date(membership.end_date)<new Date())){content.innerHTML=`<div class="status-card status-expired"><div class="status-icon">🔴</div><div class="status-title">انتهى اشتراكك</div><div class="status-msg">جدد الاشتراك بـ5$ لمتابعة التعلم والمجتمع.</div><a href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('بدي أجدد اشتراكي في AIVideoSyria')}" class="wa-btn">💳 جدد الاشتراك</a></div>`;return}const startDate=new Date(membership.start_date||membership.created_at),endDate=new Date(membership.end_date);daysSinceStart=Math.max(0,Math.floor((Date.now()-startDate.getTime())/86400000));window.__academyEndDate=Number.isNaN(endDate.getTime())?'غير محدد':endDate.toLocaleDateString('ar-SY');const {data:lessons,error}=await withTimeout(sb.from('lessons').select('*').order('display_order'),12000);if(error)throw error;allLessons=lessons||[];renderStages()}catch(error){document.getElementById('content').innerHTML='<div class="empty-stage">تعذر تحميل البيانات بسبب بطء الاتصال.<br><button class="secondary-btn" onclick="location.reload()">إعادة المحاولة</button></div>'}}
function profileMessage(text,color){const el=document.getElementById('profileMsg');el.textContent=text;el.style.color=color;el.style.display='block'}
async function saveProfile(){if(!currentUser)return;const name=document.getElementById('profileName').value.trim(),phone=document.getElementById('profilePhone').value.trim(),btn=document.getElementById('profileSaveBtn');if(!name||!phone){profileMessage('يرجى تعبئة الاسم ورقم الواتساب','#f87171');return}btn.disabled=true;btn.textContent='جاري الحفظ...';try{const results=await withTimeout(Promise.allSettled([sb.from('users').update({full_name:name,whatsapp_number:phone}).eq('id',currentUser.id),sb.auth.updateUser({data:{full_name:name,whatsapp_number:phone}})]),12000);const dbResponse=results[0].status==='fulfilled'?results[0].value:null,authResponse=results[1].status==='fulfilled'?results[1].value:null;if(dbResponse?.error&&authResponse?.error)throw dbResponse.error;window.__academyName=name;document.getElementById('accountDisplayName').textContent=name;profileMessage('تم حفظ بياناتك بنجاح ✓','#4ade80');if(allLessons.length)renderStages()}catch(error){profileMessage(error.message==='timeout'?'الاتصال بطيء. لم نترك الزر معلقاً؛ حاول مرة ثانية.':'تعذر الحفظ. يلزم تفعيل صلاحية تعديل الحساب في Supabase.','#f87171')}finally{btn.disabled=false;btn.textContent='حفظ التعديلات'}}
async function sendPasswordReset(){const btn=document.getElementById('passwordResetBtn');btn.disabled=true;btn.textContent='جاري إرسال الرابط...';try{const redirectTo=new URL('reset-password.html',location.href).href;const {error}=await withTimeout(sb.auth.resetPasswordForEmail(currentUser.email,{redirectTo}),12000);if(error)throw error;profileMessage('أرسلنا رابطاً جديداً لبريدك. افتحه من نفس المتصفح.','#4ade80')}catch(error){profileMessage('تعذر إرسال الرابط الآن. حاول مرة أخرى.','#f87171')}finally{btn.disabled=false;btn.textContent='إرسال رابط تغيير كلمة المرور'}}
function openStage(stageNum){currentStage=STAGES.find(s=>s.num===Number(stageNum));const lessons=getStageLessons(stageNum),completedCount=lessons.filter(isCompleted).length;if(!lessons.length){document.getElementById('stageContent').innerHTML=`<div class="stage-page-head"><button class="back-btn" onclick="closeStage()">← العودة للمراحل</button><div class="stage-page-title">المرحلة ${stageNum}</div><div class="stage-page-desc">${escapeHTML(currentStage?.title||'')}</div></div><div class="empty-stage">لم تتم إضافة دروس لهذه المرحلة بعد.</div>`;document.getElementById('stageModal').classList.add('open');return}const html=lessons.map((lesson,i)=>{const completed=isCompleted(lesson),unlocked=i===0||isCompleted(lessons[i-1]),status=completed?'✅':unlocked?'▶️':'🔒';return `<div class="lesson-card ${unlocked?'open':'locked'}" ${unlocked?`onclick="openLesson(${i})"`:''}><div class="lesson-number">${String(i+1).padStart(2,'0')}</div><div class="lesson-main"><h3>${escapeHTML(lesson.title||`الدرس ${i+1}`)}</h3><p>${escapeHTML(lesson.description||'درس تعليمي ضمن هذه المرحلة')}</p></div><div class="lesson-status">${status}</div></div>`}).join('');document.getElementById('stageContent').innerHTML=`<div class="stage-page-head"><button class="back-btn" onclick="closeStage()">← العودة للمراحل</button><div class="stage-page-title">المرحلة ${stageNum}</div><div class="stage-page-desc">${escapeHTML(currentStage?.title||'')} · ${completedCount} من ${lessons.length} مكتمل</div></div><div class="lesson-list">${html}</div>`;document.getElementById('stageModal').classList.add('open')}
function closeStage(){document.getElementById('stageModal').classList.remove('open')}
function openLesson(index){const lessons=getStageLessons(currentStage.num),lesson=lessons[index];if(!lesson)return;if(index>0&&!isCompleted(lessons[index-1])){alert('🔒 أكمل الدرس السابق أولاً.');return}if(!lesson.video_url){alert('الفيديو سيتوفر قريبًا، تابعنا!');return}currentLesson={lesson,index,stageNum:currentStage.num};document.getElementById('modalTitle').textContent=lesson.title||`الدرس ${index+1}`;document.getElementById('videoFrame').src=lesson.video_url;document.getElementById('videoWatermark').textContent=`AIVideoSyria · ${window.__academyName||'عضو'}`;document.getElementById('modalDesc').textContent=lesson.description||'';document.getElementById('completeBtn').textContent=isCompleted(lesson)?'✅ تم إنهاء الدرس — تابع الدرس التالي':'✅ أنهيت الدرس — افتح الدرس التالي';document.getElementById('videoModal').classList.add('open')}
function completeCurrentLesson(){if(!currentLesson)return;const stageNum=currentLesson.stageNum;progress[lessonId(currentLesson.lesson)]={completedAt:new Date().toISOString()};saveProgress();closeModal();openStage(stageNum);renderStages()}
function closeModal(){document.getElementById('videoModal').classList.remove('open');document.getElementById('videoFrame').src='';currentLesson=null}
async function loadCommunity(){chatLoaded=true;const box=document.getElementById('messages');try{const {data,error}=await withTimeout(sb.from('community_messages').select('id,user_id,display_name,message,created_at').order('created_at',{ascending:true}).limit(60),12000);if(error)throw error;renderMessages(data||[]);chatChannel=sb.channel('community-room').on('postgres_changes',{event:'INSERT',schema:'public',table:'community_messages'},payload=>appendMessage(payload.new)).subscribe()}catch(error){box.innerHTML=`<div class="chat-setup">الدردشة جاهزة داخل الملف، وباقي تفعيل جدول المجتمع مرة واحدة في Supabase.<br><a href="https://wa.me/${WHATSAPP}" target="_blank" rel="noopener">الدعم عبر واتساب حالياً</a></div>`;document.getElementById('chatForm').style.display='none'}}
function messageHTML(m){const mine=m.user_id===currentUser.id,time=new Date(m.created_at).toLocaleTimeString('ar-SY',{hour:'2-digit',minute:'2-digit'});return `<div class="message-row ${mine?'mine':''}" data-message-id="${escapeHTML(m.id)}"><div class="message-meta">${escapeHTML(m.display_name||'عضو')} · ${escapeHTML(time)}</div><div class="message-bubble">${escapeHTML(m.message)}</div></div>`}
function renderMessages(messages){const box=document.getElementById('messages');box.innerHTML=messages.length?messages.map(messageHTML).join(''):'<div class="chat-empty">كن أول من يشارك سؤالاً أو تطبيقاً 👋</div>';box.scrollTop=box.scrollHeight}
function appendMessage(message){const box=document.getElementById('messages');if(box.querySelector(`[data-message-id="${CSS.escape(String(message.id))}"]`))return;box.querySelector('.chat-empty')?.remove();box.insertAdjacentHTML('beforeend',messageHTML(message));box.scrollTop=box.scrollHeight}
async function sendMessage(event){event.preventDefault();const input=document.getElementById('chatInput'),btn=document.getElementById('sendBtn'),message=input.value.trim();if(!message||!currentUser)return;btn.disabled=true;try{const {data,error}=await withTimeout(sb.from('community_messages').insert({user_id:currentUser.id,display_name:window.__academyName||'عضو',message}).select().single(),10000);if(error)throw error;input.value='';if(data)appendMessage(data)}catch(error){alert('تعذر إرسال الرسالة. تحقق من الاتصال وحاول مجدداً.')}finally{btn.disabled=false;input.focus()}}
document.addEventListener('contextmenu',e=>{if(e.target.closest('#videoModal'))e.preventDefault()});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['s','u','p'].includes(e.key.toLowerCase()))e.preventDefault()});async function doLogout(){if(chatChannel)await sb.removeChannel(chatChannel);await sb.auth.signOut();location.href='index.html'}if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));init();
</script>
