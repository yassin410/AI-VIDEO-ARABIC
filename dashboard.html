<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f97316">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>لوحة الطالب — AI Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Cairo',sans-serif; background:#0a0e1a; color:#fff; direction:rtl; min-height:100vh; }
nav { display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-bottom:1px solid #1e2a3a; position:sticky; top:0; background:#0a0e1a; z-index:10; }
.logo { font-size:17px; font-weight:900; color:#f97316; }
.logout-btn { background:transparent; border:1px solid #1e2a3a; color:#94a3b8; padding:7px 14px; border-radius:8px; font-family:'Cairo',sans-serif; font-size:13px; cursor:pointer; }
.container { padding:24px 20px; max-width:600px; margin:0 auto; }

/* حالة pending */
.status-card { border-radius:16px; padding:24px 20px; text-align:center; margin-bottom:20px; }
.status-pending { background:rgba(249,115,22,0.08); border:1px solid rgba(249,115,22,0.2); }
.status-expired { background:rgba(239,68,68,0.08); border:1px solid rgba(239,68,68,0.2); }
.status-icon { font-size:40px; margin-bottom:12px; }
.status-title { font-size:18px; font-weight:700; margin-bottom:8px; }
.status-msg { font-size:13px; color:#94a3b8; line-height:1.7; margin-bottom:16px; }
.wa-btn { display:inline-flex; align-items:center; gap:8px; background:#25d366; color:#fff; text-decoration:none; padding:12px 24px; border-radius:10px; font-weight:700; font-size:14px; }

/* لوحة المستخدم النشط */
.welcome-box { background:#111827; border:1px solid #1e2a3a; border-radius:16px; padding:20px; margin-bottom:20px; }
.welcome-name { font-size:20px; font-weight:900; margin-bottom:4px; }
.welcome-exp { font-size:13px; color:#64748b; }
.exp-date { color:#f97316; font-weight:700; }

.stages-title { font-size:16px; font-weight:700; margin-bottom:14px; color:#94a3b8; }

/* كروت المراحل */
.stage-card { background:#111827; border:1px solid #1e2a3a; border-radius:12px; padding:16px; margin-bottom:10px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:border 0.2s; }
.stage-card.unlocked:hover { border-color:#f97316; }
.stage-card.locked { opacity:0.5; cursor:not-allowed; }
.stage-num { width:42px; height:42px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:16px; flex-shrink:0; }
.unlocked .stage-num { background:rgba(249,115,22,0.15); color:#f97316; }
.locked .stage-num { background:#1e2a3a; color:#374151; }
.stage-info { flex:1; }
.stage-info h3 { font-size:14px; font-weight:700; margin-bottom:3px; }
.stage-info p { font-size:11px; color:#64748b; }
.stage-badge { font-size:18px; }

/* مودال الدرس */
.modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:100; padding:20px; align-items:center; justify-content:center; }
.modal.open { display:flex; }
.modal-box { background:#111827; border:1px solid #1e2a3a; border-radius:16px; width:100%; max-width:500px; overflow:hidden; }
.modal-header { padding:16px 20px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #1e2a3a; }
.modal-title { font-size:16px; font-weight:700; }
.close-btn { background:transparent; border:none; color:#94a3b8; font-size:22px; cursor:pointer; }
.video-wrap { position:relative; padding-bottom:56.25%; background:#000; }
.video-wrap iframe { position:absolute; top:0; left:0; width:100%; height:100%; border:none; }
.modal-desc { padding:16px 20px; font-size:13px; color:#94a3b8; line-height:1.7; }

/* loading */
.loading { text-align:center; padding:40px; color:#64748b; }

/* صفحة الدروس */
.stage-progress { margin-top:8px; height:5px; background:#1e2a3a; border-radius:99px; overflow:hidden; }
.stage-progress-bar { height:100%; background:#f97316; border-radius:99px; transition:width .25s; }
.lesson-count { font-size:11px; color:#64748b; margin-top:3px; }
.lesson-list { display:flex; flex-direction:column; gap:10px; }
.stage-page-head { background:#111827; border:1px solid #1e2a3a; border-radius:16px; padding:18px; margin-bottom:14px; }
.back-btn { background:transparent; border:1px solid #1e2a3a; color:#cbd5e1; padding:9px 12px; border-radius:9px; font-family:'Cairo',sans-serif; cursor:pointer; margin-bottom:14px; }
.stage-page-title { font-size:20px; font-weight:900; margin-bottom:4px; }
.stage-page-desc { color:#64748b; font-size:12px; line-height:1.7; }
.lesson-card { background:#111827; border:1px solid #1e2a3a; border-radius:14px; padding:15px; display:flex; align-items:center; gap:12px; }
.lesson-card.open { cursor:pointer; }
.lesson-card.open:hover { border-color:#f97316; }
.lesson-card.locked { opacity:.55; cursor:not-allowed; }
.lesson-number { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:rgba(249,115,22,.12); color:#f97316; font-weight:900; }
.lesson-card.locked .lesson-number { background:#1e2a3a; color:#64748b; }
.lesson-main { flex:1; min-width:0; }
.lesson-main h3 { font-size:14px; margin-bottom:3px; }
.lesson-main p { font-size:11px; color:#64748b; line-height:1.6; }
.lesson-status { font-size:18px; }
.complete-btn { width:100%; margin-top:14px; padding:12px; border:0; border-radius:10px; background:#f97316; color:#fff; font-family:'Cairo',sans-serif; font-weight:700; cursor:pointer; }
.complete-btn:disabled { opacity:.55; cursor:not-allowed; }
.next-note { text-align:center; color:#64748b; font-size:11px; margin-top:8px; }
.empty-stage { background:#111827; border:1px dashed #263247; border-radius:14px; padding:30px 18px; text-align:center; color:#64748b; font-size:13px; }

</style>
</head>
<body>
<nav>
  <div class="logo">🎬 AI Academy</div>
  <button class="logout-btn" onclick="doLogout()">خروج</button>
</nav>

<div class="container">
  <div id="content" class="loading">⏳ جاري التحميل...</div>
</div>

<!-- صفحة دروس المرحلة -->
<div class="modal" id="stageModal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title">دروس المرحلة</span>
      <button class="close-btn" onclick="closeStage()">✕</button>
    </div>
    <div id="stageContent" style="padding:16px 20px 20px;"></div>
  </div>
</div>

<!-- مودال الفيديو -->
<div class="modal" id="videoModal">
  <div class="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle"></span>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="video-wrap">
      <iframe id="videoFrame" allowfullscreen></iframe>
    </div>
    <div class="modal-desc" id="modalDesc"></div>
    <div style="padding:0 20px 20px;">
      <button class="complete-btn" id="completeBtn" onclick="completeCurrentLesson()">✅ أنهيت الدرس — افتح الدرس التالي</button>
      <div class="next-note">اضغط الزر بعد مشاهدة الدرس بالكامل لفتح الدرس التالي.</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://xcbhyjgvwhnaygnpnegt.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjYmh5amd2d2huYXlnbnBuZWd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDkxODAsImV4cCI6MjEwMzk4NTE4MH0.fPh9QGniWAyg_Jg5uO0zpDoA03nvNbHHNXH9qocbmpM';
const WHATSAPP = '963951761240';
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const STAGES = [
  { num:1, title:'مقدمة وأساسيات الذكاء الاصطناعي', desc:'فهم الأدوات والمصطلحات الأساسية' },
  { num:2, title:'توليد الصور بالذكاء الاصطناعي', desc:'إنشاء صور احترافية من النص' },
  { num:3, title:'توليد الفيديوهات', desc:'تحويل الصور والأفكار لفيديوهات مذهلة' },
  { num:4, title:'الصوت والمونتاج', desc:'إضافة الصوت والمؤثرات وتحرير الفيديو' },
  { num:5, title:'ثبات الشخصية', desc:'شخصية AI متسقة في كل الفيديوهات' },
  { num:6, title:'صناعة الإعلانات', desc:'إعلانات تجارية احترافية بدون تصوير' },
  { num:7, title:'محتوى السوشيال ميديا', desc:'ريلز وتيك توك وفيسبوك بالذكاء الاصطناعي' },
  { num:8, title:'صناعة الأفلام القصيرة', desc:'قصص وأفلام كاملة من الهاتف' },
  { num:9, title:'الأتمتة وتوليد المحتوى التلقائي', desc:'نظام ينتج المحتوى لوحده' },
];

let currentUser = null;
let allLessons = [];
let currentStage = null;
let currentLesson = null;
let progress = {};

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function progressKey(userId) {
  return `ai_academy_progress_${userId}`;
}

function loadProgress() {
  try {
    progress = JSON.parse(localStorage.getItem(progressKey(currentUser.id)) || '{}') || {};
  } catch(e) { progress = {}; }
}

function saveProgress() {
  localStorage.setItem(progressKey(currentUser.id), JSON.stringify(progress));
}

function lessonId(lesson) {
  return String(lesson.id);
}

function isCompleted(lesson) {
  return !!progress[lessonId(lesson)];
}

function getStageLessons(stageNum) {
  return allLessons
    .filter(l => Number(l.display_order) === Number(stageNum))
    .sort((a,b) => {
      const ad = a.created_at ? new Date(a.created_at).getTime() : 0;
      const bd = b.created_at ? new Date(b.created_at).getTime() : 0;
      if (ad !== bd) return ad - bd;
      return String(a.id).localeCompare(String(b.id));
    });
}

function stageUnlockDays(stageLessons, stageNum) {
  const values = stageLessons.map(l => Number(l.unlock_after_days) || 0);
  return values.length ? Math.min(...values) : (stageNum - 1) * 7;
}

function stageIsUnlocked(stageNum, daysSinceStart) {
  const lessons = getStageLessons(stageNum);
  return daysSinceStart >= stageUnlockDays(lessons, stageNum);
}

function renderStages(daysSinceStart) {
  const content = document.getElementById('content');
  const stagesHTML = STAGES.map(stage => {
    const lessons = getStageLessons(stage.num);
    const unlocked = stageIsUnlocked(stage.num, daysSinceStart);
    const completed = lessons.filter(isCompleted).length;
    const total = lessons.length;
    const pct = total ? Math.round((completed / total) * 100) : 0;

    if (unlocked) {
      return `<div class="stage-card unlocked" onclick="openStage(${stage.num})">
        <div class="stage-num">${stage.num}</div>
        <div class="stage-info">
          <h3>${escapeHTML(stage.title)}</h3>
          <p>${escapeHTML(stage.desc)}</p>
          <div class="lesson-count">${total ? `${completed} / ${total} درس مكتمل` : 'لم تتم إضافة دروس بعد'}</div>
          ${total ? `<div class="stage-progress"><div class="stage-progress-bar" style="width:${pct}%"></div></div>` : ''}
        </div>
        <div class="stage-badge">📚</div>
      </div>`;
    }

    const daysLeft = Math.max(0, stageUnlockDays(lessons, stage.num) - daysSinceStart);
    return `<div class="stage-card locked">
      <div class="stage-num">🔒</div>
      <div class="stage-info">
        <h3>${escapeHTML(stage.title)}</h3>
        <p>تنفتح خلال ${daysLeft} يوم</p>
      </div>
      <div class="stage-badge">🔒</div>
    </div>`;
  }).join('');

  content.innerHTML = `
    <div class="welcome-box">
      <div class="welcome-name">أهلاً بك ${escapeHTML(window.__academyName || 'عضو')} 👋</div>
      <div class="welcome-exp">اشتراكك فعال حتى: <span class="exp-date">${escapeHTML(window.__academyEndDate || '')}</span></div>
    </div>
    <div class="stages-title">📚 مراحلك التعليمية</div>
    ${stagesHTML}`;
}

async function init() {
  const { data: { user } } = await sb.auth.getUser();
  if (!user) { window.location.href = 'login.html'; return; }
  currentUser = user;
  loadProgress();

  const { data: userData } = await sb.from('users').select('full_name, role').eq('id', user.id).single();
  if (userData?.role === 'admin') { window.location.href = 'admin.html'; return; }

  const { data: membership } = await sb.from('memberships').select('*').eq('user_id', user.id).order('created_at', { ascending: false }).limit(1).single();

  const content = document.getElementById('content');
  const name = userData?.full_name || 'عضو';
  window.__academyName = name;

  if (!membership || membership.status === 'pending') {
    content.innerHTML = `
      <div class="status-card status-pending">
        <div class="status-icon">⏳</div>
        <div class="status-title">حسابك قيد المراجعة</div>
        <div class="status-msg">مرحباً ${escapeHTML(name)}!<br>سيتم تفعيل حسابك خلال ساعات بعد تأكيد الدفع.<br>إذا أرسلت الإيصال، انتظر قليلاً أو تواصل معنا.</div>
        <a href="https://wa.me/${WHATSAPP}" class="wa-btn">📱 تواصل معنا</a>
      </div>`;
    return;
  }

  if (membership.status === 'expired' || (membership.end_date && new Date(membership.end_date) < new Date())) {
    content.innerHTML = `
      <div class="status-card status-expired">
        <div class="status-icon">🔴</div>
        <div class="status-title">انتهى اشتراكك</div>
        <div class="status-msg">مرحباً ${escapeHTML(name)}!<br>انتهت مدة اشتراكك. جدد الاشتراك بـ5$ لمتابعة التعلم.</div>
        <a href="https://wa.me/${WHATSAPP}?text=بدي أجدد اشتراكي في AI Academy" class="wa-btn">💳 جدد الاشتراك</a>
      </div>`;
    return;
  }

  const startDate = new Date(membership.start_date || membership.created_at);
  const endDate = new Date(membership.end_date);
  const daysSinceStart = Math.max(0, Math.floor((new Date() - startDate) / (1000 * 60 * 60 * 24)));
  window.__academyEndDate = endDate.toLocaleDateString('ar-SY');

  const { data: lessons, error } = await sb.from('lessons').select('*').order('display_order').order('created_at', { ascending:true });
  if (error) {
    content.innerHTML = '<div class="empty-stage">تعذر تحميل الدروس. حاول تحديث الصفحة.</div>';
    return;
  }
  allLessons = lessons || [];
  renderStages(daysSinceStart);
}

function openStage(stageNum) {
  currentStage = STAGES.find(s => s.num === Number(stageNum));
  const lessons = getStageLessons(stageNum);
  const completedCount = lessons.filter(isCompleted).length;

  if (!lessons.length) {
    document.getElementById('stageContent').innerHTML = `
      <div class="stage-page-head">
        <button class="back-btn" onclick="closeStage()">← العودة إلى المراحل</button>
        <div class="stage-page-title">المرحلة ${stageNum}</div>
        <div class="stage-page-desc">${escapeHTML(currentStage?.title || '')}</div>
      </div>
      <div class="empty-stage">لم تتم إضافة دروس لهذه المرحلة بعد.<br>ستظهر هنا تلقائيًا عند إضافتها من لوحة الإدارة.</div>`;
    document.getElementById('stageModal').classList.add('open');
    return;
  }

  const lessonsHTML = lessons.map((lesson, i) => {
    const completed = isCompleted(lesson);
    const previousDone = i === 0 || isCompleted(lessons[i - 1]);
    const unlocked = previousDone;
    const status = completed ? '✅' : (unlocked ? '▶️' : '🔒');
    const stateClass = unlocked ? 'open' : 'locked';
    return `<div class="lesson-card ${stateClass}" ${unlocked ? `onclick="openLesson(${i})"` : ''}>
      <div class="lesson-number">${String(i+1).padStart(2,'0')}</div>
      <div class="lesson-main">
        <h3>${escapeHTML(lesson.title || `الدرس ${i+1}`)}</h3>
        <p>${escapeHTML(lesson.description || 'درس تعليمي ضمن هذه المرحلة')}</p>
      </div>
      <div class="lesson-status">${status}</div>
    </div>`;
  }).join('');

  document.getElementById('stageContent').innerHTML = `
    <div class="stage-page-head">
      <button class="back-btn" onclick="closeStage()">← العودة إلى المراحل</button>
      <div class="stage-page-title">المرحلة ${stageNum}</div>
      <div class="stage-page-desc">${escapeHTML(currentStage?.title || '')} · ${completedCount} / ${lessons.length} مكتمل</div>
    </div>
    <div class="lesson-list">${lessonsHTML}</div>`;
  document.getElementById('stageModal').classList.add('open');
}

function closeStage() {
  document.getElementById('stageModal').classList.remove('open');
}

function openLesson(index) {
  const lessons = getStageLessons(currentStage.num);
  const lesson = lessons[index];
  if (!lesson) return;
  const previousDone = index === 0 || isCompleted(lessons[index - 1]);
  if (!previousDone) {
    alert('🔒 أكمل الدرس السابق أولاً.');
    return;
  }
  if (!lesson.video_url) {
    alert('الفيديو سيتوفر قريبًا، تابعنا!');
    return;
  }

  currentLesson = { lesson, index, stageNum: currentStage.num };
  document.getElementById('modalTitle').textContent = lesson.title || `الدرس ${index+1}`;
  document.getElementById('videoFrame').src = lesson.video_url;
  document.getElementById('modalDesc').textContent = lesson.description || '';
  const btn = document.getElementById('completeBtn');
  btn.textContent = isCompleted(lesson) ? '✅ تم إنهاء الدرس — يمكنك متابعة الدرس التالي' : '✅ أنهيت الدرس — افتح الدرس التالي';
  document.getElementById('videoModal').classList.add('open');
}

function completeCurrentLesson() {
  if (!currentLesson) return;
  progress[lessonId(currentLesson.lesson)] = { completedAt: new Date().toISOString() };
  saveProgress();
  closeModal();
  openStage(currentLesson.stageNum);
}

function closeModal() {
  document.getElementById('videoModal').classList.remove('open');
  document.getElementById('videoFrame').src = '';
  currentLesson = null;
}

async function doLogout() {
  await sb.auth.signOut();
  window.location.href = 'index.html';
}

init();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function (error) {
      console.warn('Service Worker registration failed:', error);
    });
  });
}
</script>
</body>
</html>
