<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#f97316">
<title>تغيير كلمة المرور — AIVideoSyria</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0a0e1a;color:#fff;font-family:Cairo,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:420px;background:#111827;border:1px solid #1e2a3a;border-radius:20px;padding:28px 22px}.title{text-align:center;font-size:22px;font-weight:900;margin-bottom:6px}.sub{text-align:center;color:#94a3b8;font-size:13px;line-height:1.7;margin-bottom:18px}.verify{display:flex;align-items:center;justify-content:center;gap:8px;background:#0a0e1a;border:1px solid #1e2a3a;border-radius:10px;padding:10px;margin-bottom:18px;color:#94a3b8;font-size:12px}.dot{width:9px;height:9px;border-radius:50%;background:#f59e0b}.verify.ready{color:#4ade80;border-color:rgba(74,222,128,.25)}.verify.ready .dot{background:#22c55e}.verify.error{color:#f87171;border-color:rgba(248,113,113,.25)}.verify.error .dot{background:#ef4444}label{display:block;color:#94a3b8;font-size:13px;margin-bottom:6px}input{width:100%;padding:12px;background:#0a0e1a;border:1px solid #1e2a3a;border-radius:10px;color:#fff;font:14px Cairo;margin-bottom:14px;outline:0}input:focus{border-color:#f97316}button{width:100%;padding:13px;background:#f97316;color:#fff;border:0;border-radius:10px;font:700 15px Cairo;cursor:pointer}button:disabled{opacity:.45;cursor:wait}.msg{text-align:center;font-size:13px;line-height:1.7;margin-top:14px;display:none}.success{color:#4ade80}.error{color:#f87171}.back{display:block;text-align:center;color:#f97316;text-decoration:none;font-size:13px;margin-top:16px}</style>
</head>
<body><div class="card"><div class="title">إنشاء كلمة مرور جديدة</div><div class="sub">نتحقق أولاً أن رابط الاسترجاع يخص حسابك، ثم يمكنك حفظ كلمة المرور بأمان.</div><div id="verify" class="verify"><span class="dot"></span><span id="verifyText">جاري التحقق من الرابط...</span></div><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" minlength="8" autocomplete="new-password" placeholder="8 أحرف على الأقل" disabled><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" placeholder="أعد كتابة كلمة المرور" disabled><button id="saveBtn" onclick="savePassword()" disabled>انتظر التحقق...</button><div id="msg" class="msg"></div><a class="back" href="login.html">العودة لتسجيل الدخول</a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://xcbhyjgvwhnaygnpnegt.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjYmh5amd2d2huYXlnbnBuZWd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDkxODAsImV4cCI6MjEwMzk4NTE4MH0.fPh9QGniWAyg_Jg5uO0zpDoA03nvNbHHNXH9qocbmpM';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
let recoveryReady=false;
function message(text,type){const el=document.getElementById('msg');el.textContent=text;el.className='msg '+type;el.style.display='block'}
function setVerify(state,text){const box=document.getElementById('verify');box.className='verify '+state;document.getElementById('verifyText').textContent=text;const ready=state==='ready';recoveryReady=ready;document.getElementById('password').disabled=!ready;document.getElementById('confirm').disabled=!ready;const btn=document.getElementById('saveBtn');btn.disabled=!ready;btn.textContent=ready?'حفظ كلمة المرور':'انتظر التحقق...'}
async function prepareRecovery(){
 try{
  const params=new URLSearchParams(location.search),code=params.get('code');
  let {data:{session}}=await sb.auth.getSession();
  if(!session&&code){const {data,error}=await sb.auth.exchangeCodeForSession(code);if(error)throw error;session=data.session;history.replaceState({},document.title,location.pathname)}
  if(!session){session=await new Promise(resolve=>{let done=false,subscription=null,timer=null;const finish=value=>{if(done)return;done=true;clearTimeout(timer);if(subscription)subscription.unsubscribe();resolve(value)};const listener=sb.auth.onAuthStateChange((event,newSession)=>{if(event==='PASSWORD_RECOVERY'||newSession)finish(newSession)});subscription=listener.data.subscription;timer=setTimeout(()=>finish(null),8000)});}
  if(!session)throw new Error('no-session');
  setVerify('ready','تم التحقق من الحساب — يمكنك اختيار كلمة مرور جديدة');document.getElementById('password').focus();
 }catch(error){setVerify('error','تعذر التحقق من الرابط. اطلب رابطاً جديداً وافتح آخر رسالة فقط.');message('قد يكون الرابط مستخدماً سابقاً أو فُتح بمتصفح مختلف. ارجع لتسجيل الدخول واطلب رابطاً جديداً.','error')}
}
async function savePassword(){
 if(!recoveryReady)return;
 const p=document.getElementById('password').value,c=document.getElementById('confirm').value,b=document.getElementById('saveBtn');
 if(p.length<8)return message('كلمة المرور يجب أن تكون 8 أحرف على الأقل','error');if(p!==c)return message('كلمتا المرور غير متطابقتين','error');
 b.disabled=true;b.textContent='جاري الحفظ...';
 try{const timeout=new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),12000));const {error}=await Promise.race([sb.auth.updateUser({password:p}),timeout]);if(error)throw error;message('تم تغيير كلمة المرور بنجاح ✓','success');b.textContent='تم الحفظ ✓';setTimeout(async()=>{await sb.auth.signOut();location.href='login.html'},1300)}
 catch(error){message(error.message==='timeout'?'الاتصال بطيء. حاول مرة أخرى.':'تعذر تغيير كلمة المرور. اطلب رابطاً جديداً وافتح آخر رسالة وصلت فقط.','error');b.disabled=false;b.textContent='حفظ كلمة المرور'}
}
prepareRecovery();
</script></body></html>
