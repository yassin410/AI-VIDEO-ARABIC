<title>تغيير كلمة المرور — AIVideoSyria</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0a0e1a;color:#fff;font-family:Cairo,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:420px;background:#111827;border:1px solid #1e2a3a;border-radius:20px;padding:28px 22px}.title{text-align:center;font-size:22px;font-weight:900;margin-bottom:6px}.sub{text-align:center;color:#94a3b8;font-size:13px;line-height:1.7;margin-bottom:22px}label{display:block;color:#94a3b8;font-size:13px;margin-bottom:6px}input{width:100%;padding:12px;background:#0a0e1a;border:1px solid #1e2a3a;border-radius:10px;color:#fff;font:14px Cairo;margin-bottom:14px;outline:0}button{width:100%;padding:13px;background:#f97316;color:#fff;border:0;border-radius:10px;font:700 15px Cairo;cursor:pointer}button:disabled{opacity:.6}.msg{text-align:center;font-size:13px;line-height:1.7;margin-top:14px;display:none}.success{color:#4ade80}.error{color:#f87171}.back{display:block;text-align:center;color:#f97316;text-decoration:none;font-size:13px;margin-top:16px}</style>
</head>
<body><div class="card"><div class="title">إنشاء كلمة مرور جديدة</div><div class="sub">اختر كلمة مرور جديدة لحسابك في AIVideoSyria.</div><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" minlength="8" placeholder="8 أحرف على الأقل"><label for="confirm">تأكيد كلمة المرور</label><input id="confirm" type="password" minlength="8" placeholder="أعد كتابة كلمة المرور"><button id="saveBtn" onclick="savePassword()">حفظ كلمة المرور</button><div id="msg" class="msg"></div><a class="back" href="login.html">العودة لتسجيل الدخول</a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://xcbhyjgvwhnaygnpnegt.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjYmh5amd2d2huYXlnbnBuZWd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg0MDkxODAsImV4cCI6MjEwMzk4NTE4MH0.fPh9QGniWAyg_Jg5uO0zpDoA03nvNbHHNXH9qocbmpM';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function message(t,c){const e=document.getElementById('msg');e.textContent=t;e.className='msg '+c;e.style.display='block'}
async function savePassword(){const p=document.getElementById('password').value,c=document.getElementById('confirm').value,b=document.getElementById('saveBtn');if(p.length<8)return message('كلمة المرور يجب أن تكون 8 أحرف على الأقل','error');if(p!==c)return message('كلمتا المرور غير متطابقتين','error');b.disabled=true;b.textContent='جاري الحفظ...';const{error}=await sb.auth.updateUser({password:p});if(error){message('انتهت صلاحية الرابط. اطلب رابطاً جديداً.','error');b.disabled=false;b.textContent='حفظ كلمة المرور';return}message('تم تغيير كلمة المرور بنجاح ✓','success');b.textContent='تم الحفظ ✓';setTimeout(()=>location.href='login.html',1500)}
</script></body></html>
